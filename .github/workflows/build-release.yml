name: Build Jellyfin plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.QueueToPlaylist/Jellyfin.Plugin.QueueToPlaylist.csproj

      - name: Publish plugin
        run: dotnet publish Jellyfin.Plugin.QueueToPlaylist/Jellyfin.Plugin.QueueToPlaylist.csproj --configuration Release --output artifacts/publish --no-restore

      - name: Assemble Jellyfin plugin ZIP
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p "artifacts/package/QueueToPlaylist_${VERSION}"
          cp artifacts/publish/Jellyfin.Plugin.QueueToPlaylist.dll "artifacts/package/QueueToPlaylist_${VERSION}/"
          if [ -f artifacts/publish/Jellyfin.Plugin.QueueToPlaylist.pdb ]; then
            cp artifacts/publish/Jellyfin.Plugin.QueueToPlaylist.pdb "artifacts/package/QueueToPlaylist_${VERSION}/"
          fi
          cp web/queue-to-playlist.js "artifacts/package/QueueToPlaylist_${VERSION}/"
          cp web/queue-to-playlist.css "artifacts/package/QueueToPlaylist_${VERSION}/"
          cd artifacts/package
          zip -r "../QueueToPlaylist_${VERSION}.zip" "QueueToPlaylist_${VERSION}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QueueToPlaylist
          path: artifacts/QueueToPlaylist_*.zip

      - name: Create GitHub release for a tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/QueueToPlaylist_*.zip
